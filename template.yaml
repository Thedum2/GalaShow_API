AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Galashow API (Dev & Prod)

Parameters:
  StageNameParam:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Public Route 53 hosted zone for galashow.cloud
  DatabaseHost:
    Type: String
    MinLength: 1
  DatabasePort:
    Type: Number
    Default: 3306
    MinValue: 1
    MaxValue: 65535
  DatabaseName:
    Type: String
    Default: galashow
  DatabaseSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:.*'
  JwtSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:.*'
  ChzzkSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+'
    Description: Optional CHZZK app secret JSON containing clientId and clientSecret
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

Conditions:
  IsDev:  !Equals [ !Ref StageNameParam, dev ]
  IsProd: !Equals [ !Ref StageNameParam, prod ]
  HasChzzkSecret: !Not [ !Equals [ !Ref ChzzkSecretArn, '' ] ]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Environment:
      Variables:
        STAGE: !Ref StageNameParam
        DB_HOST: !Ref DatabaseHost
        DB_PORT: !Ref DatabasePort
        DB_NAME: !Ref DatabaseName
        DB_SECRET_ARN: !Ref DatabaseSecretArn
        JWT_SECRET_ARN: !Ref JwtSecretArn
        CORS_ALLOWED_ORIGINS: !If
          - IsDev
          - 'https://dev.galashow.cloud,https://admin-dev.galashow.cloud'
          - 'https://galashow.cloud,https://admin.galashow.cloud'

Resources:
  DatabaseInitializer:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: dotnet8
    Properties:
      FunctionName: !Sub galashow-cloud-${StageNameParam}-database-initializer
      CodeUri: database/Initializer/
      Handler: GalaShow.DatabaseInitializer::GalaShow.DatabaseInitializer.Function::FunctionHandler
      Runtime: dotnet8
      Timeout: 180
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
        SubnetIds: !Ref PrivateSubnetIds
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DatabaseSecretArn
  
  
  DevApi:
    Condition: IsDev
    Type: AWS::Serverless::Api
    Properties:
      Name: Galashow-dev
      StageName: dev
      Description: Development API for dev.galashow.cloud
      BinaryMediaTypes:
        - "multipart/form-data"
        - "multipart/*"
  
  
  ### Prod API (only when StageNameParam=prod)
  ProdApi:
    Condition: IsProd
    Type: AWS::Serverless::Api
    Properties:
      Name:      Galashow-prod
      StageName: prod
      BinaryMediaTypes:
        - "multipart/form-data"
        - "multipart/*"
  
  
  DevBannerFunction:
    Condition: IsDev
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: dotnet8
      BuildProperties:
        ProjectFile: GalaShow.Banner.csproj
        Framework: net8.0
    Properties:
      FunctionName: DevBannerFunction
      CodeUri: src/GalaShow.Banner/
      Handler: GalaShow.Banner::GalaShow.Banner.Function::FunctionHandler
      Runtime: dotnet8
      
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroupId]
        SubnetIds: !Ref PrivateSubnetIds
      Policies:
        - AWSLambdaVPCAccessExecutionRole
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: [!Ref DatabaseSecretArn, !Ref JwtSecretArn]
      Events:
        GetBanners:
          Type: Api
          Properties:
            RestApiId: !Ref DevApi
            Path: /banners
            Method: get
        UpdateBanner:
          Type: Api
          Properties:
            RestApiId: !Ref DevApi
            Path: /banners/{bannerId}
            Method: put
        OptionsBanners:
          Type: Api
          Properties:
            RestApiId: !Ref DevApi
            Path: /banners
            Method: options
        OptionsBannerId:
          Type: Api
          Properties:
            RestApiId: !Ref DevApi
            Path: /banners/{bannerId}
            Method: options

