            RestApiId: !Ref ProdApi
            Path: /viewer-avatars
            Method: options

  ApiCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !If [IsDev, api-dev.galashow.cloud, api.galashow.cloud]
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !If [IsDev, api-dev.galashow.cloud, api.galashow.cloud]
          HostedZoneId: !Ref HostedZoneId

  ### Dev Custom Domain
  DevDomain:
    Condition: IsDev
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: api-dev.galashow.cloud
      RegionalCertificateArn: !Ref ApiCertificate
      SecurityPolicy: TLS_1_2
      EndpointConfiguration:
        Types: [ REGIONAL ]

  ### Prod Custom Domain
  ProdDomain:
    Condition: IsProd
    Type: AWS::ApiGateway::DomainName
    Properties:
      DomainName: api.galashow.cloud
      RegionalCertificateArn: !Ref ApiCertificate
      SecurityPolicy: TLS_1_2
      EndpointConfiguration:
        Types: [ REGIONAL ]

  ### Dev BasePathMapping
  DevBasePathMapping:
    Condition: IsDev
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: DevApidevStage
    Properties:
      DomainName: !Ref DevDomain
      RestApiId:  !Ref DevApi
      Stage:      dev
      BasePath:   ""

  ### Prod BasePathMapping
  ProdBasePathMapping:
    Condition: IsProd
    Type: AWS::ApiGateway::BasePathMapping
    DependsOn: ProdApiprodStage
    Properties:
      DomainName: !Ref ProdDomain
      RestApiId:  !Ref ProdApi
      Stage:      prod
      BasePath:   ""

  ### Dev DNS Record
  DevDNSRecord:
    Condition: IsDev
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: api-dev.galashow.cloud
      Type:         A
      AliasTarget:
        DNSName:      !GetAtt DevDomain.RegionalDomainName
        HostedZoneId: !GetAtt DevDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

  ### Prod DNS Record
  ProdDNSRecord:
    Condition: IsProd
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: api.galashow.cloud
      Type:         A
      AliasTarget:
        DNSName:      !GetAtt ProdDomain.RegionalDomainName
        HostedZoneId: !GetAtt ProdDomain.RegionalHostedZoneId
        EvaluateTargetHealth: false

Outputs:
  DatabaseInitializerFunction:
    Value: !Ref DatabaseInitializer
  ApiUrl:
    Value: !If [IsDev, 'https://api-dev.galashow.cloud', 'https://api.galashow.cloud']
