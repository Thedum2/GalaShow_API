name: GalaShow API CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate CloudFormation templates
        run: |
          python -m pip install cfn-lint==1.57.1
          cfn-lint template.yaml infra/certificate.yaml infra/database.yaml infra/artifacts.yaml infra/web.json infra/github-actions.json
      - name: Offline regression tests
        run: >-
          dotnet test GalaShow_API.sln --configuration Release --filter 'Category!=Integration'
          --logger trx --results-directory artifacts/test-results/api
      - name: Initializer request validation
        run: >-
          dotnet test database/Initializer.Tests/GalaShow.DatabaseInitializer.Tests.csproj --configuration Release
          --logger trx --results-directory artifacts/test-results/initializer
      - name: Test deployment checks
        run: python -m unittest discover -s infra/tests -v
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
      url: ${{ inputs.stage == 'prod' && 'https://api.galashow.cloud' || 'https://api-dev.galashow.cloud' }}
    concurrency:
      group: api-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
      cancel-in-progress: false
    env:
      DEPLOY_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
      HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check deployment settings
        shell: pwsh
        run: |
          foreach ($setting in 'HOSTED_ZONE_ID', 'AWS_ACCOUNT_ID', 'AWS_ROLE_ARN') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($setting))) {
              throw "Missing deployment setting: $setting. See infra/README.md."
            }
          }
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: galashow-api-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
      - name: Build, package and deploy selected environment
        shell: pwsh
        run: |
          ./infra/deploy-api.ps1 -Stage $env:DEPLOY_STAGE -HostedZoneId $env:HOSTED_ZONE_ID -Region $env:AWS_REGION -Profile ''
      - name: Check deployed API and CORS
        shell: pwsh
        run: python infra/smoke-test.py --stage $env:DEPLOY_STAGE --api-only --allow-empty
      - name: Deployment summary
        shell: pwsh
        run: |
          $apiUrl = if ($env:DEPLOY_STAGE -eq 'prod') { 'https://api.galashow.cloud' } else { 'https://api-dev.galashow.cloud' }
          @(
            "### API deployment passed"
            "- Environment: $env:DEPLOY_STAGE"
            "- API: $apiUrl"
            "- Commit: $env:GITHUB_SHA"
            '- API read and CORS checks passed.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
